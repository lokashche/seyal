# Sample playbook: evaluate and approve a new job before work starts.
# Sales agrees the basics with the client; Operations plans the work and confirms the fee; then the
# job is approved. Generic example only. Real playbooks live in each business's own set-up.
id: job-evaluation
version: "0.2"
description: Evaluate a new piece of client work. Sales agrees the basics, Operations plans it and confirms the fee, then it is approved before work starts.
examples:
  - "New monthly bookkeeping job for Acme Traders, fee 12000"
  - "Acme Traders wants annual accounts done, agreed 30000, they send data by 15th"
numbering: "J-{yyyy}-{seq:4}"
title: "{client} — {nature_of_work}"
roles: [sales, ops, owner]

fields:
  - { key: client, label: Client, type: master, kind: client, required: true, ask: "Which client is this for?" }
  - key: nature_of_work
    label: Nature of work
    type: master
    kind: work_type
    required: true
    ask: "What kind of work is it?"
    prefill:
      required_documents: documents
      timeline_days: timeline_days
      maker: maker
      checker: checker
      reviewer: reviewer
      standard_fee: standard_fee
      est_hours: est_hours
  - { key: reason, label: Reason for job, type: text, required: true, ask: "Why does the client need this?" }
  - { key: required_documents, label: Documents required, type: list, of: text, ask: "Which documents do we need from the client?" }
  - { key: resources, label: Resources, type: list, of: person, ask: "Who will work on it?" }
  - { key: timeline_days, label: Timeline (days), type: number, ask: "How many days will it take?" }
  - { key: maker, label: Maker, type: person, ask: "Who will do the work (maker)?" }
  - { key: checker, label: Checker, type: person }
  - { key: reviewer, label: Reviewer, type: person }
  - { key: est_hours, label: Estimated hours, type: number }
  - { key: standard_fee, label: Standard fee, type: money, readonly: true }
  - { key: fee_agreed, label: Fee agreed, type: money, required: true, ask: "What fee do we confirm?" }
  - { key: fee_proposed, label: Fee proposed by Sales, type: money, readonly: true }
  - { key: advance, label: Advance, type: money, ask: "Any advance received?" }
  - { key: client_data_due, label: Client data due, type: date, ask: "When will the client send their data?" }
  - { key: scope_exclusions, label: Scope exclusions, type: text }
  - { key: integrity_check, label: Integrity check, type: choice, options: [pass, fail], required: true, ask: "Did the integrity check pass?" }
  - { key: payment_terms, label: Payment terms, type: text, ask: "What are the payment terms?" }

states: [draft, with_ops, pending_approval, approved, cancelled]
initial: draft

# Who has the job in each step, and what Seyal asks there. Sales may give a fee when they know it;
# Operations must confirm one.
steps:
  draft: { owner: starter, asks: [client, nature_of_work, reason, integrity_check], needs: [client, nature_of_work, reason, integrity_check] }
  with_ops: { owner: "role:ops", asks: [required_documents, timeline_days, maker, fee_agreed], needs: [required_documents, timeline_days, maker, fee_agreed] }

transitions:
  - { action: send_to_ops, from: [draft], to: with_ops, when: required_filled }
  - { action: submit, from: [with_ops], to: pending_approval, when: required_filled }
  - { action: back_to_sales, from: [with_ops], to: draft, needs: reason }
  - { action: cancel, from: [draft, with_ops, pending_approval, approved], to: cancelled, needs: reason }

approvals:
  in: pending_approval
  on_complete: approved
  on_reject: draft
  slots:
    - { slot: ops, role: ops }
    # Sales confirms again only when the fee is not the one Sales proposed (or Sales gave none).
    - slot: sales
      role: sales
      required_if: { field: fee_agreed, ne: { field: fee_proposed } }
    - slot: owner
      role: owner
      required_if:
        any:
          - { field: nature_of_work.fixed_price, ne: true }
          - { field: fee_agreed, lt: { field: standard_fee } }
          - { field: nature_of_work.is_new, eq: true }
          - { field: integrity_check, eq: fail }

deadlines:
  - { due_from: client_data_due }

on:
  with_ops:
    - { do: copy, from: fee_agreed, to: fee_proposed }
    - { do: post, text: "Over to Operations. Please check the documents, timeline, people and fee (most are filled in from the work type), change anything that's off, then say \"submit\". Say \"back to sales because ...\" if Sales needs to look again." }
  approved:
    - { do: post, text: "Approved. Over to {maker}." }
    - { do: assign, to: maker }
