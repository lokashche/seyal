# A version tag (e.g. v0.1.0) makes a release from one build:
#   - downloadable binaries for Linux, Windows and macOS (Intel and ARM), with checksums;
#   - a container image ghcr.io/<owner>/seyal:<version> (and :latest) for Linux amd64 and arm64.
# Tags are made only when the maintainer decides to release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=seyal-${GITHUB_REF_NAME}-${os}-${arch}
            ext=""; [ "$os" = windows ] && ext=.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/seyal$ext" ./cmd/seyal
            cp -r LICENSE README.md examples deploy "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name")
            else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
