{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "4..", "swap": true, "error": false}, {"code": "5..", "swap": true, "error": true}]}'>
  <title>{{block "title" .}}Seyal{{end}}</title>
  <meta name="theme-color" content="#c9861a">
  {{if .Slug}}<link rel="manifest" href="/t/{{.Slug}}/manifest.webmanifest">{{end}}
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Seyal">
  <link rel="stylesheet" href="/static/fonts.css?v={{.Asset}}">
  <link rel="stylesheet" href="/static/app.css?v={{.Asset}}">
  <script src="/static/htmx.min.js?v={{.Asset}}" defer></script>
  <script src="/static/app.js?v={{.Asset}}" defer></script>
</head>
<body hx-boost="true">
{{template "content" .}}
</body>
</html>
{{end}}

{{define "bar"}}
<header class="bar">
  <a class="brand" href="/t/{{.Slug}}/">Seyal<span class="tamil" lang="ta">செயல்</span></a>
  <span class="biz">{{.Business}}</span>
  <nav class="who">
    {{if .Admin}}<a class="btn ghost sm" href="/t/{{.Slug}}/settings/people">Settings</a>{{end}}
    <span>{{.Session.Name}}</span>
    <form method="post" action="/t/{{.Slug}}/logout"><button class="btn ghost sm">Log out</button></form>
  </nav>
</header>
{{with .Notice}}<p class="banner notice" role="status">{{.}}</p>{{end}}
{{with .Error}}<p class="banner error" role="alert">{{.}}</p>{{end}}
{{end}}
